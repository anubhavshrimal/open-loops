# Deploys the public site to GitHub Pages.
# The site is the files of site/ plus the repo's assets/ folder at assets/, so that the pages can use "assets/<file>".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the offline checks
        run: python3 -m unittest discover -s tests/cycle_fixture

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Put site/ and assets/ into one folder
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
