<!doctype html>
<!-- The Open Loops guided tour. The engine is tour.js. All Tasks, PRs, people and numbers are invented. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Loops — guided tour</title>
<link rel="icon" type="image/png" href="assets/wick-sticker-96.png">
<style>
:root{--sp:1;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;--teal:#0f9d8a;--amber:#f5a524;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#e9e7e1;font:13px/1.45 var(--sans);color:#1f2328}
/* caption */
#cap{height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid #ddd}
#cap .clock{font:700 20px var(--mono);white-space:nowrap}
#cap .who{font:700 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.who.you{background:#fff1dc;color:#9a5a00}.who.cycle{background:#e3f5f2;color:#0b7b6c}.who.worker{background:#e7edff;color:#2f5bd3}.who.check{background:#eef0f3;color:#4b5563}
#cap .head{font-size:15px;font-weight:600}
#cap .cnt{margin-left:auto;font:11.5px var(--mono);color:#6b7280;white-space:nowrap}
/* viewport + desk */
#vp{position:absolute;top:58px;left:0;right:0;bottom:0;overflow:hidden}
#desk{position:absolute;left:0;top:0;width:1400px;height:800px;transform-origin:0 0;transition:transform calc(1.1s / var(--sp)) var(--ease)}
#content{position:absolute;inset:0}
.win{position:absolute;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px #0002,0 8px 24px #0000001a;display:flex;flex-direction:column;background:#fff}
.win.pop{z-index:5;box-shadow:0 24px 60px #0004}
#dim{position:absolute;inset:0;background:rgba(10,12,18,.55);opacity:0;transition:opacity calc(.6s / var(--sp));pointer-events:none;z-index:18}#dim.on{opacity:1}
.ring{position:absolute;border:3px solid var(--amber);border-radius:12px;box-shadow:0 0 0 6px #f5a52440,0 10px 40px #0006;pointer-events:none;z-index:20;animation:ringin calc(.7s / var(--sp)) var(--ease)}
@keyframes ringin{from{opacity:0;transform:scale(1.06)}}
#callouts{position:absolute;inset:0;pointer-events:none;z-index:30}
.co{position:absolute;background:#fff;border-radius:12px;padding:13px 16px;box-shadow:0 18px 50px #0005;opacity:0;transform:translateY(8px);transition:opacity calc(.45s / var(--sp)),transform calc(.45s / var(--sp)) var(--ease)}
.co.on{opacity:1;transform:none}.co.zm{width:340px;border-left:4px solid var(--amber)}
.co.ov{left:50%;top:14px;width:min(820px,calc(100% - 40px));transform:translate(-50%,8px);border-left:5px solid var(--amber)}.co.ov.on{transform:translate(-50%,0)}
.co .k{font:700 11px var(--mono);color:#b26b00;margin-bottom:4px}
.co .tx{font-size:15.5px;line-height:1.45}.co.ov .tx{font-size:16.5px}
/* animations between states */
.enter{animation:enter calc(.6s / var(--sp)) var(--ease) both}@keyframes enter{from{opacity:0;transform:translateY(8px)}}
tr.enter{animation:rowin calc(.6s / var(--sp)) var(--ease) both}@keyframes rowin{from{opacity:0;background:#f5a52455}}
.pop-in{animation:popin calc(.55s / var(--sp)) var(--ease) both}@keyframes popin{from{opacity:0;transform:scale(.92) translateY(14px)}}
.pop-out{transition:opacity calc(.3s / var(--sp)),transform calc(.3s / var(--sp));opacity:0;transform:scale(.96)}
.flying{z-index:4;position:relative;box-shadow:0 12px 28px #0003!important}
#cursor{position:absolute;z-index:40;width:22px;height:22px;opacity:0;transition:left calc(.8s / var(--sp)) var(--ease),top calc(.8s / var(--sp)) var(--ease),opacity calc(.3s / var(--sp));pointer-events:none;left:700px;top:400px}
#cursor.on{opacity:1}#cursor svg{filter:drop-shadow(0 2px 3px #0006)}
#cursor:after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid var(--amber);opacity:0}
#cursor.click:after{animation:clk calc(.4s / var(--sp)) ease-out}@keyframes clk{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.typing{color:#1f2328!important;border-color:#0969da!important}
/* boards */
.gh-top{height:46px;flex:none;background:#f6f8fa;border-bottom:1px solid #d0d7de;display:flex;align-items:center;padding:0 14px;font-size:13.5px}
.gh-top .oct{width:22px;height:22px;border-radius:50%;background:#1f2328;margin-right:10px}
.gh-top .tabs{margin-left:22px;color:#59636e;display:flex;gap:16px}.gh-top .tabs span.on{color:#1f2328;font-weight:600;border-bottom:2px solid #fd8c73;padding-bottom:11px;margin-bottom:-13px}
.board{flex:1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px;overflow:hidden;background:#fff}
.col{min-width:0;border-radius:8px;padding:6px}.col.gh{background:#f6f8fa;border:1px solid #d0d7de}
.col h5{margin:2px 4px 7px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}.col h5 span{color:#6b7280;font-weight:400;margin-left:auto}.col h5 i{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid}
.card{background:#fff;border-radius:7px;padding:6px 8px 7px;margin-bottom:6px;font-size:12px;position:relative}
.card.gh{border:1px solid #d0d7de}
.card .r{color:#59636e;font-size:10.5px;display:flex;gap:4px;align-items:center}.card .r i{width:10px;height:10px;border-radius:50%;border:2px solid #1a7f37}.card .r i.cl{border-color:#8250df;background:#8250df}
.card .t{font-weight:600;margin:1px 0 4px;line-height:1.3}
.card .m{display:flex;gap:4px;flex-wrap:wrap}
.lbl{display:inline-block;font-size:10.5px;font-weight:500;border-radius:999px;padding:0 7px;margin:1px 3px 0 0;border:1px solid}
/* PR (GitHub) */
.br{height:34px;flex:none;background:#dfe3e8;display:flex;align-items:center;gap:6px;padding:0 10px}.br i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.br i:nth-child(2){background:#febc2e}.br i:nth-child(3){background:#28c840}
.br .url{flex:1;margin-left:10px;background:#fff;border-radius:6px;padding:3px 10px;font:11.5px var(--mono);color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghpr{padding:16px 20px 18px;overflow:hidden}.ghpr h3{margin:0;font-size:21px;font-weight:400}.ghpr h3 span{color:#59636e}
.ghpr .st{display:flex;align-items:center;gap:8px;margin:8px 0 12px;color:#59636e;font-size:12.5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:500;font-size:12.5px;border-radius:999px;padding:4px 11px}.pill.draft{background:#59636e}.pill.merged{background:#8250df}.pill.open{background:#1f883d}
.ghc{border:1px solid #d0d7de;border-radius:6px;margin:16px 0 16px 40px;position:relative}
.ghc:before{content:"";position:absolute;left:-40px;top:0;width:30px;height:30px;border-radius:50%;background:var(--av,#8b949e)}
.ghc .h{background:#f6f8fa;border-bottom:1px solid #d0d7de;padding:6px 10px;font-size:12px;color:#59636e}.ghc .h b{color:#1f2328}.ghc .b{padding:8px 10px;font-size:13px}
.ghchk{border:1px solid #d0d7de;border-radius:6px;padding:10px 12px;margin:10px 0 0 40px;display:flex;gap:10px;align-items:center}
.ghchk .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:#1f883d}.sm2{color:#59636e;font-size:12px}
.mergebtn{margin-left:auto;background:#1f883d;color:#fff;border-radius:6px;padding:5px 12px;font-weight:600;font-size:12.5px;white-space:nowrap}.mergebtn.m{background:#8250df}.mergebtn.dr{background:#f6f8fa;color:#1f2328;border:1px solid #d0d7de}
.ghbox{margin:10px 0 0 40px;border:1px solid #d0d7de;border-radius:6px;padding:8px}
.ta{border:1px solid #d0d7de;border-radius:6px;padding:8px 10px;min-height:44px;color:#8c959f;font-size:13px;background:#fff}
.cbtn{display:inline-block;margin-top:6px;float:right;background:#1f883d;color:#fff;border-radius:6px;padding:4px 12px;font-weight:600;font-size:12.5px}
.ghbox:after,.pnl-box:after{content:"";display:block;clear:both}
/* task side panel */
.panel{border:1px solid #d0d7de}
.pnl-h{flex:none;padding:12px 14px;border-bottom:1px solid #e5e7eb;display:flex;flex-direction:column;gap:2px}.pnl-h b{font-size:15px}.pnl-h span{color:#6b7280;font-size:12px}
.pnl-b{padding:10px 14px;overflow:hidden}.pnl-d{color:#555;font-size:12px;margin-bottom:8px}
.pnl-c{border:1px solid #e5e7eb;border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:12.5px}
.pnl-box{margin-top:6px}
/* Slack */
.sl{display:flex;height:100%}
.sl-side{width:140px;flex:none;background:#3f0e40;color:#cfc3cf;padding:10px 0;font-size:12.5px}.sl-side .ws{color:#fff;font-weight:700;padding:0 12px 10px;border-bottom:1px solid #ffffff22;margin-bottom:8px}
.sl-side div.c{padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sl-side div.c.on{background:#1164a3;color:#fff}
.sl-main{flex:1;display:flex;flex-direction:column;min-width:0}
.sl-h{height:42px;flex:none;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:14px}
.sl-msgs{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 0}
.sm{display:flex;gap:9px;padding:5px 14px;flex:none}.sm .a{flex:none;width:32px;height:32px;border-radius:6px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.sm .n{font-weight:700;font-size:13px}.sm .n small{font-weight:400;color:#616061;font-size:11px;margin-left:5px}.sm .n .app{background:#e8e8e8;color:#616061;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:3px;margin-left:4px}
.sm .x{font-size:13px}.sm .ev{font:11px var(--mono);color:#616061;background:#f4f4f4;border-radius:3px;padding:0 4px}
.sm.enter{animation:slin calc(.6s / var(--sp)) var(--ease) both}@keyframes slin{from{opacity:0;transform:translateY(14px);background:#fff8e1}}
.sl-in{flex:none;margin:6px 14px 12px;border:1px solid #bbb;border-radius:8px;padding:9px;color:#999;font-size:12.5px}
/* terminals */
.term{background:#14161b;color:#d8dee9;font:12px/1.55 var(--mono)}
.tt{height:30px;flex:none;background:#1d2027;display:flex;align-items:center;gap:6px;padding:0 10px;color:#8a93a3;font-size:11.5px;white-space:nowrap;overflow:hidden}.tt i{flex:none;width:10px;height:10px;border-radius:50%;background:#3a3f4b}
.tt b{color:#e6e6e6;font-weight:600;margin-left:6px}.tt .tr{margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.cc-box{flex:none;border:1px solid #d97757;border-radius:6px;padding:5px 10px;margin:10px 12px 4px;color:#d97757;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines{flex:1;min-height:0;overflow:hidden;padding:4px 12px;white-space:pre-wrap;word-break:break-word;display:flex;flex-direction:column;justify-content:flex-end}
.foot{flex:none;border-top:1px solid #2a2f3a;padding:5px 12px;color:#8a93a3;font-size:11px}
.o{color:#d97757}.g{color:#7ee2b8}.d{color:#6b7385}.y{color:#f5c26b}.r{color:#ff8a8a}.w{color:#fff}
.hd-tabs{flex:none;display:flex;gap:2px;padding:0 6px;background:#1d2027;height:30px;align-items:flex-end;overflow:hidden}
.hd-tabs span{flex:0 1 auto;min-width:0;background:#252932;color:#9aa3b2;padding:4px 9px;border-radius:6px 6px 0 0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd-tabs span.on{background:#14161b;color:#fff;flex:none}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:6px;padding:6px}
.panes.ex{display:flex;flex-direction:column}.pane.mini{flex:none}.pane.mini .pl,.pane.mini .res{display:none}.pane.big{flex:1}
.pane{border:1px solid #2a2f3a;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.pane .ph{flex:none;background:#1d2027;padding:3px 8px;font-size:11px;color:#7ee2b8;display:flex;justify-content:space-between;white-space:nowrap}.pane.dead .ph{color:#6b7385}
.pane .pl{padding:4px 8px;white-space:pre-wrap;font-size:11px;line-height:1.5;overflow:hidden;flex:none}.pane.dead .pl{opacity:.55}
.res{font-size:11px;border-collapse:collapse;margin:2px 8px 6px;width:calc(100% - 16px)}.res td{padding:1px 6px;border-top:1px solid #2a2f3a}.res .k{color:#7ee2b8}.res .v{color:#6b7385}.res .v td:nth-child(2){text-decoration:line-through}
/* artifacts */
.art{padding:16px 24px 20px;overflow:hidden;font-size:13px}
.art h2{margin:0 0 2px;font-size:19px}.art .sub{color:#6b7280;margin-bottom:10px;font-size:12px}
.art h4{margin:10px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:#0b7b6c}
.art ul{margin:0;padding-left:18px}.art li{margin:2px 0}
.art .g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.art .q h4{color:#b26b00}
.art .resp{border-left:3px solid var(--amber);padding-left:10px;margin-top:12px}
.art table{border-collapse:collapse;width:100%;font-size:12px}.art td,.art th{border-bottom:1px solid #eee;padding:3px 6px;text-align:left}
.art .kept{color:#0b7b6c;font-weight:600}.art .rev{color:#9ca3af}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}.sum div{background:#f4f6f8;border-radius:8px;padding:8px}.sum b{display:block;font-size:18px}
/* controls */
#ctl{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #ddd;border-radius:999px;padding:6px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px #0002;z-index:60;font-size:12px;white-space:nowrap}
#ctl button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit}#ctl button.on{background:#1f2328;color:#fff;border-color:#1f2328}
#ctl input{width:200px}#spd{display:inline-flex;gap:3px}#spd button{padding:4px 7px}
html.rec #ctl{display:none}html.embed #cap{height:50px}html.embed #vp{top:50px}
</style>
</head>
<body>
<div id="cap"></div>
<div id="vp"><div id="desk"><div id="content"></div><div id="dim"></div><div id="rings"></div>
 <div id="cursor"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l14 9-6 1.5L8 19z" fill="#fff" stroke="#1f2328" stroke-width="1.6" stroke-linejoin="round"/></svg></div></div>
 <div id="callouts"></div></div>
<div id="ctl"><button id="bPrev" type="button" title="Back (←)">◀</button><button id="bPlay" type="button">▶ play</button><button id="bNext" type="button" title="Next (→)">▶</button><input type="range" id="rng" min="0" value="0" aria-label="Step"><span id="posl" style="font:12px var(--mono);min-width:54px"></span>
 <span style="color:#999">speed</span><span id="spd"></span></div>
<script>{const q=new URLSearchParams(location.search);window.EMBED=q.get('embed')==='1';window.REC=q.get('rec')==='1';window.TOUR_CTL_H=REC?16:62;if(EMBED)document.documentElement.classList.add('embed');if(REC)document.documentElement.classList.add('rec')}</script><script src="tour.js"></script>
<script>
window.onBeat=()=>{$('rng').max=STORY.S.length-1;$('rng').value=step;$('posl').textContent=`${step+1}/${STORY.S.length}`};
window.onPlay=on=>{$('bPlay').textContent=on?'❚❚ pause':'▶ play'};
$('bPrev').onclick=back;$('bNext').onclick=fwd;$('rng').oninput=e=>jump(+e.target.value,0);
$('bPlay').onclick=()=>{if(!timer&&atEnd()){step=0;beat=0;enter(0)}play()};
const SP=[1,1.25,1.5,2],spdBtns=()=>{$('spd').innerHTML=SP.map(x=>`<button type="button" data-sp="${x}" class="${x===SPEED?'on':''}">${x}×</button>`).join('')};
$('spd').onclick=e=>{const b=e.target.closest('[data-sp]');if(!b)return;setSpeed(+b.dataset.sp);const u=new URL(location);u.searchParams.set('speed',b.dataset.sp);history.replaceState(null,'',u);spdBtns()};
{const q=+new URLSearchParams(location.search).get('speed');if(SP.includes(q))setSpeed(q)}spdBtns();
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='Escape'&&window.EMBED){parent.postMessage('ol-exit-full','*');return}if(e.key==='ArrowLeft'||e.key===',')back();if(e.key==='ArrowRight'||e.key==='.')fwd();if(e.key===' '){e.preventDefault();$('bPlay').click()}});
addEventListener('resize',()=>jump(step,beat));
step=0;beat=0;enter(0);
</script>
</body>
</html>
