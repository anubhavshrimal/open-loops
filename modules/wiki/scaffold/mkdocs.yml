site_name: Memory Palace
docs_dir: wiki

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo

plugins:
  - search
  - obsidian-bridge
  - callouts

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
